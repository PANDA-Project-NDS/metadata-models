name: Generate JSON Schema and HTML Overview
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Generate HTML
        run: uv run metadata_schema_html.py > metadata-schema.html

      - name: Generate JSON Schema
        run: uv run scripts/dump_clean_schema.py > metadata-schema.json

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: metadata-schema-html
          path: metadata-schema.html
          retention-days: 90

      - name: Upload JSON Schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: metadata-schema-json
          path: metadata-schema.json
          retention-days: 90
