[project]
name = "acp-pipeline-planing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "llama-index>=0.14.21",
    "llama-index-embeddings-huggingface>=0.7.0",
    "llama-index-embeddings-openai>=0.6.0",
    "llama-index-vector-stores-mongodb>=0.10.1",
    "logfire>=4.32.1",
    "pydantic-ai>=1.84.1",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "tqdm>=4.67.3",
    "trafilatura>=2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=5.0",
    "dirty-equals>=0.8",
]

[tool.uv.workspace]
members = ["models", "golden"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "golden/tests"]
pythonpath = [".", "tests"]
