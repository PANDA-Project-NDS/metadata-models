name: Generate Schema HTML

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --system

      - name: Generate HTML
        run: python scripts/metadata_schema_html.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: metadata-schema-html
          path: metadata_schema.html
          retention-days: 90
